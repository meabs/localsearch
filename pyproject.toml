[project]
name = "operation-lens-v2"
version = "0.1.0"
description = "Local-first evidence-driven intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1.3",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "lancedb>=0.17.0",
  "networkx>=3.3",
  "pdfplumber>=0.11.4",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "python-multipart>=0.0.12",
  "python-dotenv>=1.0.1",
  "rapidfuzz>=3.10.0",
  "spacy>=3.7.6",
  "tiktoken>=0.8.0",
  "uvicorn>=0.30.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
